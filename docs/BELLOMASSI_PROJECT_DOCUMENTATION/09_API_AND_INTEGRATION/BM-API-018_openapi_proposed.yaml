      x-errors: —
      x-request: —
      x-response: User
      responses:
        '200':
          description: User
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
        '403':
          description: Missing permission or out of scope
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /users/{id}/unlock:
    post:
      summary: Clear lockout
      tags:
      - User API
