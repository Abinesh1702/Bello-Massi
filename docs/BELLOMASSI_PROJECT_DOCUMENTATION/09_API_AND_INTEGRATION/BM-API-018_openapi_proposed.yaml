paths:
  /auth/login:
    post:
      summary: Sign in with username / email / mobile and password
      tags:
      - Authentication API
      x-permission: (public)
      x-errors: 400 validation; 401 invalid credentials; 423 locked (RULE-001); 403 inactive (RULE-002)
      x-request: '{identifier, password, app: office or driver or customer}'
      x-response: '{access, refresh_expires, user, roles, permissions, landing_path}'
      responses:
        '200':
          description: '{access, refresh_expires, user, roles, permissions, landing_path}'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
        '403':
          description: Missing permission or out of scope
      requestBody:
        description: '{identifier, password, app: office or driver or customer}'
        content:
          application/json:
            schema:
              type: object
      security: []
  /auth/mfa:
    post:
      summary: Verify TOTP for privileged roles
      tags:
      - Authentication API
      x-permission: (public, mfa token)
      x-errors: 401 wrong code; 429 too many attempts
      x-request: '{mfa_token, code}'
      x-response: '{access, user}'
      responses:
        '200':
          description: '{access, user}'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
        '403':
          description: Missing permission or out of scope
      requestBody:
        description: '{mfa_token, code}'
        content:
          application/json:
            schema:
              type: object
      security: []
  /auth/refresh:
    post:
      summary: Rotate access token
      tags:
      - Authentication API
      x-permission: (refresh cookie)
      x-errors: 401 expired / revoked refresh token
      x-request: —
      x-response: '{access}'
      responses:
        '200':
          description: '{access}'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
        '403':
          description: Missing permission or out of scope
  /auth/logout:
    post:
      summary: Revoke refresh token
      tags:
      - Authentication API
      x-permission: (authenticated)
      x-errors: —
      x-request: —
      x-response: '204'
      responses:
        '200':
          description: '204'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
        '403':
          description: Missing permission or out of scope
  /auth/password/forgot:
    post:
      summary: Send reset code by email / SMS
      tags:
      - Authentication API
      x-permission: (public)
      x-errors: 429 rate limit
      x-request: '{identifier}'
      x-response: 202 (always, no user enumeration)
      responses:
        '200':
          description: 202 (always, no user enumeration)
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
        '403':
          description: Missing permission or out of scope
      requestBody:
        description: '{identifier}'
        content:
          application/json:
            schema:
              type: object
      security: []
  /auth/password/reset:
    post:
      summary: Reset with code
      tags:
      - Authentication API
      x-permission: (public)
      x-errors: 400 invalid / expired code; password policy (RULE-004)
      x-request: '{identifier, code, new_password}'
      x-response: '204'
      responses:
        '200':
          description: '204'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
        '403':
          description: Missing permission or out of scope
      requestBody:
        description: '{identifier, code, new_password}'
        content:
          application/json:
            schema:
              type: object
      security: []
  /auth/password/change:
    post:
      summary: Change own password
      tags:
      - Authentication API
      x-permission: (authenticated)
      x-errors: 400 policy; 401 wrong current password
      x-request: '{current_password, new_password}'
      x-response: '204'
      responses:
        '200':
          description: '204'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
        '403':
          description: Missing permission or out of scope
      requestBody:
        description: '{current_password, new_password}'
        content:
          application/json:
            schema:
              type: object
  /auth/me:
    get:
      summary: Current user, roles, permissions, scope
      tags:
      - Authentication API
      x-permission: (authenticated)
      x-errors: —
      x-request: —
      x-response: '{user, roles, permissions, data_scope}'
      responses:
        '200':
          description: '{user, roles, permissions, data_scope}'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
        '403':
          description: Missing permission or out of scope
  /users:
    get:
      summary: List users with filters (role, hub, status, search)
      tags:
      - User API
      x-permission: users.view
      x-errors: —
      x-request: —
      x-response: page<User>
      responses:
        '200':
          description: page<User>
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
        '403':
          description: Missing permission or out of scope
    post:
      summary: Create user
      tags:
      - User API
      x-permission: users.manage
      x-errors: 400 validation; 409 duplicate username / email
      x-request: User (without password_hash) + temporary_password
      x-response: User
      responses:
        '200':
          description: User
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
        '403':
          description: Missing permission or out of scope
      requestBody:
        description: User (without password_hash) + temporary_password
        content:
          application/json:
            schema:
              type: object
  /users/{id}:
    get:
      summary: User detail
      tags:
      - User API
      x-permission: users.view
      x-errors: '404'
      x-request: —
      x-response: User
      responses:
        '200':
          description: User
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
        '403':
          description: Missing permission or out of scope
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    patch:
      summary: Update user
      tags:
      - User API
      x-permission: users.manage
      x-errors: 403 Super Admin protection (RULE-005)
      x-request: partial User
      x-response: User
      responses:
        '200':
          description: User
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
        '403':
          description: Missing permission or out of scope
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        description: partial User
        content:
          application/json:
            schema:
              type: object
  /users/{id}/deactivate:
    post:
      summary: Deactivate
      tags:
      - User API
      x-permission: users.manage
      x-errors: 400 cannot deactivate self (RULE-005)
      x-request: —
      x-response: User
      responses:
