<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Limitations Document — Prototype vs Production</title><style>:root{--navy:#232B5F;--navy2:#34427A;--amber:#F5A623;--ink:#1B2033;--ink2:#3B4256;--muted:#6B7285;--line:#DCE0EA;--soft:#F5F6FA;--soft2:#EEF0F8}
*{box-sizing:border-box}
html{-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{margin:0;background:#fff;color:var(--ink);font:14px/1.55 Inter,Arial,Helvetica,sans-serif}
a{color:var(--navy2);text-decoration:none}
a:hover{text-decoration:underline}
code{font-family:"DejaVu Sans Mono",Menlo,Consolas,monospace;font-size:.86em;background:var(--soft2);color:#2A3270;padding:.05em .3em;border-radius:3px;overflow-wrap:break-word}
h1,h2,h3,h4{color:var(--navy);line-height:1.25;font-weight:700}
h1.chapter{font-size:26px;margin:0 0 18px;padding:0 0 10px;border-bottom:3px solid var(--amber)}
h2{font-size:19px;margin:28px 0 10px;padding-bottom:4px;border-bottom:1px solid var(--line)}
h3{font-size:16px;margin:22px 0 8px;color:var(--navy2)}
p{margin:8px 0}
ul,ol{margin:6px 0 10px;padding-left:22px}
li{margin:2px 0}
blockquote{margin:12px 0;padding:8px 14px;border-left:4px solid var(--amber);background:#FFF8EA;color:var(--ink2)}
blockquote p{margin:2px 0}
hr{border:0;border-top:1px solid var(--line);margin:24px 0}
table{border-collapse:collapse;width:100%;margin:10px 0 16px;font-size:12.5px;line-height:1.4}
th{background:var(--navy);color:#fff;font-weight:600;text-align:left;padding:6px 8px;vertical-align:bottom}
td{padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:nth-child(even) td{background:var(--soft)}
th[style*="center"],td[style*="center"]{text-align:center}
figure.diagram{margin:14px 0 18px;padding:12px;border:1px solid var(--line);border-radius:8px;background:#fff;text-align:center}
figure.diagram img{max-width:100%;height:auto}
figure.diagram figcaption{font-size:11px;color:var(--muted);margin-top:4px}

/* cover */
.cover{min-height:100vh;display:flex;flex-direction:column;justify-content:space-between;padding:56px 64px;background:linear-gradient(160deg,#232B5F 0%,#34427A 70%,#3E4E8C 100%);color:#fff}
.cover .brand{font-weight:800;letter-spacing:.18em;font-size:15px;display:flex;align-items:center;gap:10px}
.cover .mark{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:8px;background:var(--amber);color:var(--navy);font-weight:800;letter-spacing:0}
.cover .kicker{color:var(--amber);text-transform:uppercase;letter-spacing:.16em;font-size:13px;font-weight:700;margin:0 0 12px}
.cover-title{color:#fff;font-size:44px;line-height:1.1;margin:0 0 18px;font-weight:800;border:0}
.cover-sub{font-size:16px;max-width:620px;color:#D9DDF0}
.cover-meta{width:auto;font-size:13px;margin:0;border-top:1px solid rgba(255,255,255,.25)}
.cover-meta th{background:none;color:var(--amber);padding:6px 18px 6px 0;font-weight:600;white-space:nowrap}
.cover-meta td{border:0;color:#fff;padding:6px 0;background:none!important}

/* toc */
.toc{padding:40px 64px}
.toc-title{font-size:26px;border-bottom:3px solid var(--amber);margin:0 0 16px;padding-bottom:10px}
.toc ul{list-style:none;padding:0;margin:0;columns:1}
.toc li a{display:flex;align-items:baseline;color:var(--ink)}
.toc li.l1{margin-top:10px;font-weight:700}
.toc li.l1 a{color:var(--navy)}
.toc li.l2{padding-left:22px;font-size:13px}
.toc li.l2 a{color:var(--ink2)}
.toc .dots{flex:1;border-bottom:1px dotted #A9AFC3;margin:0 6px;transform:translateY(-4px)}
.toc .pg{min-width:24px;text-align:right;font-variant-numeric:tabular-nums}

/* screen layout */
body.screen{background:#F3F4F8}
body.screen .cover{min-height:auto;max-width:1120px;margin:24px auto 0;border-radius:14px;gap:48px}
body.screen .toc{max-width:1120px;margin:16px auto;background:#fff;border-radius:14px;border:1px solid var(--line)}
body.screen .toc ul{columns:2;column-gap:40px}
body.screen .toc li{break-inside:avoid}
body.screen .content{max-width:1120px;margin:16px auto 40px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:40px 64px}
body.screen h1.chapter{margin-top:56px}
body.screen h1.chapter:first-child{margin-top:0}
body.screen .content table{display:block;overflow-x:auto}
@media (max-width:760px){
  body.screen .cover,body.screen .toc,body.screen .content{border-radius:0;margin:0;padding:24px 16px}
  body.screen .toc ul{columns:1}
  .cover-title{font-size:32px}
}

/* print */
@page{size:A4;margin:20mm 15mm 18mm 15mm}
body.print{font-size:10.5pt;line-height:1.45}
body.print .cover{height:296mm;min-height:0;padding:22mm 20mm;overflow:hidden}
body.print .toc{padding:0}
body.print .toc li.l2{font-size:9.5pt}
body.print h1.chapter{break-before:page;font-size:20pt}
body.print h1.chapter:first-child{break-before:auto}
body.print h2{font-size:14pt;break-after:avoid}
body.print h3{font-size:12pt;break-after:avoid}
body.print table{font-size:8.6pt}
body.print tr{break-inside:avoid}
body.print thead{display:table-header-group}
body.print figure.diagram{break-inside:avoid;padding:6px;border:0;margin:8px 0}
body.print figure.diagram img{max-width:100%}
body.print a{color:inherit}
body.print .content{padding:0}
table.wide th,table.wide td{padding:3px 4px}
table.wide td:nth-child(n+3),table.wide th:nth-child(n+3){text-align:center}
body.print table.wide{font-size:7pt}
body.print table.wide code{font-size:6.6pt}
body.print table.dense{font-size:7.8pt}
</style></head><body class="print"><section class="cover"><div class="brand"><span class="mark">B</span> BELLOMASSI</div><div class="cover-main"><p class="kicker">Client Handover</p>
<h1 class="cover-title">Limitations Document — Prototype vs Production</h1><p class="cover-sub">Bellomassi Order-to-Delivery Management Platform</p></div>
